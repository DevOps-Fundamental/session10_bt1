<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="vmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="cntGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="hwGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="guestGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
    <linearGradient id="dockerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="1000" height="640" fill="url(#bgGrad)" rx="16"/>

  <rect x="25" y="20" width="950" height="60" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="500" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="700" fill="#f8fafc" text-anchor="middle">SO SÁNH KIẾN TRÚC MÁY ẢO (VIRTUAL MACHINE) VÀ DOCKER CONTAINER</text>
  <text x="500" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">Ảo hóa phần cứng (Hypervisor) vs Ảo hóa cấp hệ điều hành (Linux Namespaces &amp; cgroups)</text>

  <!-- Left: Virtual Machine Architecture -->
  <g transform="translate(35, 105)">
    <rect width="445" height="425" rx="12" fill="#1e293b" stroke="#0284c7" stroke-width="1.5" filter="url(#shadow)"/>
    <rect width="445" height="40" rx="12" fill="url(#vmGrad)"/>
    <text x="222" y="26" font-family="sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">VIRTUAL MACHINE (HYPERVISOR)</text>

    <!-- Apps & Bins -->
    <g transform="translate(20, 55)">
      <!-- VM 1 -->
      <g transform="translate(0, 0)">
        <rect width="195" height="150" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        <rect x="10" y="10" width="175" height="35" rx="5" fill="#3b82f6"/>
        <text x="97" y="32" font-family="sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">ỨNG DỤNG A (App A)</text>

        <rect x="10" y="52" width="175" height="30" rx="5" fill="#1e40af"/>
        <text x="97" y="72" font-family="sans-serif" font-size="10.5" fill="#e0e7ff" text-anchor="middle">Thư viện &amp; Binary riêng</text>

        <rect x="10" y="88" width="175" height="50" rx="5" fill="url(#guestGrad)"/>
        <text x="97" y="108" font-family="sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">GUEST OS (Kernel riêng)</text>
        <text x="97" y="126" font-family="sans-serif" font-size="9.5" fill="#fee2e2" text-anchor="middle">Hao phí: 5GB - 20GB</text>
      </g>

      <!-- VM 2 -->
      <g transform="translate(210, 0)">
        <rect width="195" height="150" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        <rect x="10" y="10" width="175" height="35" rx="5" fill="#3b82f6"/>
        <text x="97" y="32" font-family="sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">ỨNG DỤNG B (App B)</text>

        <rect x="10" y="52" width="175" height="30" rx="5" fill="#1e40af"/>
        <text x="97" y="72" font-family="sans-serif" font-size="10.5" fill="#e0e7ff" text-anchor="middle">Thư viện &amp; Binary riêng</text>

        <rect x="10" y="88" width="175" height="50" rx="5" fill="url(#guestGrad)"/>
        <text x="97" y="108" font-family="sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">GUEST OS (Kernel riêng)</text>
        <text x="97" y="126" font-family="sans-serif" font-size="9.5" fill="#fee2e2" text-anchor="middle">Hao phí: 5GB - 20GB</text>
      </g>
    </g>

    <!-- Hypervisor -->
    <g transform="translate(20, 220)">
      <rect width="405" height="42" rx="8" fill="#f59e0b" stroke="#d97706" stroke-width="1"/>
      <text x="202" y="26" font-family="sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">HYPERVISOR (KVM / VMware / VirtualBox)</text>
    </g>

    <!-- Host OS -->
    <g transform="translate(20, 275)">
      <rect width="405" height="42" rx="8" fill="#0284c7" stroke="#0369a1" stroke-width="1"/>
      <text x="202" y="26" font-family="sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">HỆ ĐIỀU HÀNH MÁY CHỦ (HOST OS)</text>
    </g>

    <!-- Hardware -->
    <g transform="translate(20, 330)">
      <rect width="405" height="50" rx="8" fill="url(#hwGrad)" stroke="#64748b" stroke-width="1"/>
      <text x="202" y="25" font-family="sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">PHẦN CỨNG MÁY CHỦ (HARDWARE)</text>
      <text x="202" y="41" font-family="sans-serif" font-size="10" fill="#cbd5e1" text-anchor="middle">CPU • RAM • Ổ đĩa Storage • Card mạng Network</text>
    </g>
  </g>

  <!-- Right: Docker Container Architecture -->
  <g transform="translate(520, 105)">
    <rect width="445" height="425" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="1.5" filter="url(#shadow)"/>
    <rect width="445" height="40" rx="12" fill="url(#cntGrad)"/>
    <text x="222" y="26" font-family="sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">DOCKER CONTAINER (OS VIRTUALIZATION)</text>

    <!-- Containers -->
    <g transform="translate(20, 55)">
      <!-- Container 1 -->
      <g transform="translate(0, 0)">
        <rect width="195" height="95" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
        <rect x="10" y="10" width="175" height="35" rx="5" fill="#10b981"/>
        <text x="97" y="32" font-family="sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">ỨNG DỤNG A (App A)</text>

        <rect x="10" y="52" width="175" height="32" rx="5" fill="#065f46"/>
        <text x="97" y="68" font-family="sans-serif" font-size="10" fill="#d1fae5" text-anchor="middle">Bins / Libs (Gọn nhẹ)</text>
        <text x="97" y="80" font-family="sans-serif" font-size="8.5" fill="#a7f3d0" text-anchor="middle">Dung lượng: Vài MB - Vài chục MB</text>
      </g>

      <!-- Container 2 -->
      <g transform="translate(210, 0)">
        <rect width="195" height="95" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
        <rect x="10" y="10" width="175" height="35" rx="5" fill="#10b981"/>
        <text x="97" y="32" font-family="sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">ỨNG DỤNG B (App B)</text>

        <rect x="10" y="52" width="175" height="32" rx="5" fill="#065f46"/>
        <text x="97" y="68" font-family="sans-serif" font-size="10" fill="#d1fae5" text-anchor="middle">Bins / Libs (Gọn nhẹ)</text>
        <text x="97" y="80" font-family="sans-serif" font-size="8.5" fill="#a7f3d0" text-anchor="middle">Dung lượng: Vài MB - Vài chục MB</text>
      </g>
    </g>

    <!-- Docker Engine -->
    <g transform="translate(20, 165)">
      <rect width="405" height="42" rx="8" fill="url(#dockerGrad)" stroke="#1d4ed8" stroke-width="1"/>
      <text x="202" y="26" font-family="sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">DOCKER ENGINE / CONTAINER RUNTIME</text>
    </g>

    <!-- Host OS & Kernel -->
    <g transform="translate(20, 220)">
      <rect width="405" height="95" rx="8" fill="#0f172a" stroke="#0284c7" stroke-width="1.5"/>
      <text x="202" y="24" font-family="sans-serif" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="middle">HỆ ĐIỀU HÀNH HOST (DÙNG CHUNG LINUX KERNEL)</text>
      
      <rect x="15" y="35" width="180" height="48" rx="5" fill="#1e293b" stroke="#3b82f6"/>
      <text x="105" y="55" font-family="sans-serif" font-size="10.5" font-weight="600" fill="#93c5fd" text-anchor="middle">NAMESPACES (Cô lập)</text>
      <text x="105" y="72" font-family="sans-serif" font-size="9" fill="#cbd5e1" text-anchor="middle">PID, NET, MNT, IPC, UTS</text>

      <rect x="210" y="35" width="180" height="48" rx="5" fill="#1e293b" stroke="#10b981"/>
      <text x="300" y="55" font-family="sans-serif" font-size="10.5" font-weight="600" fill="#6ee7b7" text-anchor="middle">CGROUPS (Giới hạn tài nguyên)</text>
      <text x="300" y="72" font-family="sans-serif" font-size="9" fill="#cbd5e1" text-anchor="middle">CPU Quota, Memory Limit, I/O</text>
    </g>

    <!-- Hardware -->
    <g transform="translate(20, 330)">
      <rect width="405" height="50" rx="8" fill="url(#hwGrad)" stroke="#64748b" stroke-width="1"/>
      <text x="202" y="25" font-family="sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">PHẦN CỨNG MÁY CHỦ (HARDWARE)</text>
      <text x="202" y="41" font-family="sans-serif" font-size="10" fill="#cbd5e1" text-anchor="middle">CPU • RAM • Ổ đĩa Storage • Card mạng Network</text>
    </g>
  </g>

  <!-- Bottom Note -->
  <g transform="translate(35, 545)">
    <rect width="930" height="75" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="30" y="28" font-family="sans-serif" font-size="12" font-weight="700" fill="#38bdf8">ĐIỂM KHÁC BIỆT CỐT LÕI:</text>
    <text x="30" y="48" font-family="sans-serif" font-size="11.5" fill="#cbd5e1">• VM ảo hóa toàn bộ phần cứng và mỗi máy ảo phải chạy một Kernel Guest OS riêng biệt (hao phí hàng GB RAM/Disk).</text>
    <text x="30" y="66" font-family="sans-serif" font-size="11.5" fill="#cbd5e1">• Container chia sẻ trực tiếp Host Linux Kernel, cô lập bằng Namespaces và cgroups (khởi động tính bằng mili-giây, dung lượng vài chục MB).</text>
  </g>
</svg>
